<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="恒熠聚声 GLEAM 资讯：全球信号网络与团队动态。">
  <title>资讯 · 恒熠聚声 GLEAM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23d4af37' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23f0c96a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div class="app" id="app" data-lang="zh" data-theme="dark">
    <main class="home" id="home">
      <section class="stage" aria-label="全球信号网络">
        <header class="stage-head">
          <div class="brand-block">
            <div class="brand-name">GLEAM</div>
            <div class="brand-sub" id="brand-sub">恒熠聚声 · 资讯</div>
          </div>
          <div class="network-label"><span class="network-dot"></span>GLOBAL SIGNAL NETWORK</div>
        </header>

        <div class="globe-wrap" id="globe-wrap">
          <canvas id="globe-canvas" aria-label="旋转中的金色地球，信息线连接不同大陆"></canvas>
          <div class="globe-corner globe-corner-tl" aria-hidden="true"></div>
          <div class="globe-corner globe-corner-br" aria-hidden="true"></div>
        </div>

        <div class="settings" id="settings" role="group" aria-label="显示设置">
          <div class="setting-group lang-group" data-group="lang">
            <div class="lang-static">
              <button class="opt lang-opt is-on" type="button" data-lang="zh" aria-pressed="true">中文</button>
              <button class="opt lang-opt" type="button" data-lang="en" aria-pressed="false">EN</button>
              <span class="pipe pipe-center" aria-hidden="true"></span>
            </div>
          </div>

          <div class="setting-group wheel-group wheel-run" data-group="run" data-cols="2">
            <div class="wheel" data-wheel="run">
              <div class="wheel-row" data-row-lang="zh">
                <button class="opt is-on" type="button" data-run="1" style="grid-column:1" aria-pressed="true">进行</button>
                <button class="opt" type="button" data-run="0" style="grid-column:3" aria-pressed="false">停止</button>
              </div>
              <div class="wheel-row" data-row-lang="en">
                <button class="opt" type="button" data-run="1" style="grid-column:1">ON</button>
                <button class="opt" type="button" data-run="0" style="grid-column:3">OFF</button>
              </div>
            </div>
            <span class="pipe pipe-center" aria-hidden="true"></span>
          </div>

          <div class="setting-group wheel-group wheel-speed" data-group="speed" data-cols="3">
            <div class="wheel" data-wheel="speed">
              <div class="wheel-row" data-row-lang="zh">
                <button class="opt is-on" type="button" data-speed="fast" style="grid-column:1" aria-pressed="true">快</button>
                <button class="opt" type="button" data-speed="medium" style="grid-column:3" aria-pressed="false">中</button>
                <button class="opt" type="button" data-speed="slow" style="grid-column:5" aria-pressed="false">慢</button>
              </div>
              <div class="wheel-row" data-row-lang="en">
                <button class="opt" type="button" data-speed="fast" style="grid-column:1">F</button>
                <button class="opt" type="button" data-speed="medium" style="grid-column:3">M</button>
                <button class="opt" type="button" data-speed="slow" style="grid-column:5">S</button>
              </div>
            </div>
            <span class="pipe pipe-one" aria-hidden="true"></span>
            <span class="pipe pipe-two" aria-hidden="true"></span>
          </div>

          <div class="setting-group count-group" role="group" aria-label="资讯总数">
            <span class="count" id="news-count">8</span>
          </div>
        </div>
      </section>

      <section class="feed-panel" id="feed-panel" aria-label="资讯列表">
        <header class="feed-head">
          <div class="feed-heading">
            <span class="feed-kicker">LIVE FEED</span>
            <span class="feed-title" id="feed-title">资讯</span>
          </div>
        </header>

        <div class="feed-viewport" id="feed-viewport">
          <div class="feed-list" id="feed-list"></div>
        </div>

        <div class="load-error" id="load-error" role="status" hidden>
          数据加载失败，请刷新页面
        </div>

        <div class="feed-fade feed-fade-bottom" aria-hidden="true"></div>
      </section>
    </main>

    <article class="article-page" id="article-page" aria-hidden="true">
      <div class="article-scroll" id="article-scroll">
        <header class="article-top">
          <button class="icon-btn back-btn" id="back-btn" type="button" aria-label="返回资讯列表">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.8 5.2 8 12l6.8 6.8"></path>
              <path d="M8.4 12h11"></path>
            </svg>
          </button>

          <div class="article-actions">
            <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="切换明暗模式" aria-pressed="false">
              <svg class="theme-icon theme-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4.7"></circle>
                <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"></path>
              </svg>
              <svg class="theme-icon theme-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.6 13.1A8.6 8.6 0 1 1 10.9 3.4a6.8 6.8 0 0 0 9.7 9.7z"></path>
              </svg>
            </button>
            <span class="icon-slot" data-icon-slot="2" aria-hidden="true"></span>
            <span class="icon-slot" data-icon-slot="3" aria-hidden="true"></span>
          </div>
        </header>

        <div class="article-body-wrap">
          <h1 class="article-title" id="article-title"></h1>
          <div class="article-spacer" aria-hidden="true"></div>
          <div class="article-body" id="article-body"></div>
        </div>
      </div>
    </article>
  </div>

  <noscript>
    <div class="noscript">此页面需要开启 JavaScript 才能显示动态资讯网络。</div>
  </noscript>

  <script src="assets/vendor/d3.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
